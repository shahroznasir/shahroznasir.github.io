<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#050816"/>
            <stop offset="100%" stop-color="#0B1120"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#5B8CFF"/>
            <stop offset="100%" stop-color="#00E5A8"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background Container -->
    <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#3ddc84" stroke-width="12" stroke-opacity="0.4"/>
    
    <!-- Outer Glow Ring -->
    <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Terminal Prompt Symbol & Monogram SN -->
    <text x="70" y="320" font-family="'Fira Code', monospace, sans-serif" font-size="190" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">SN</text>
    
    <!-- Sparkle Star -->
    <path d="M 400 130 L 412 170 L 452 182 L 412 194 L 400 234 L 388 194 L 348 182 L 388 170 Z" fill="#3ddc84" filter="url(#glow)"/>
    
    <!-- Terminal Cursor Line -->
    <rect x="360" y="270" width="32" height="60" rx="4" fill="#3ddc84"/>
</svg>
